[project]
name = "black-devmenus"
version = "0.1.0"
description = "Patcher that makes Black & White's developer key menus switchable in game"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
